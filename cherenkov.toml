# cherenkov.toml — generated by `cherenkov init`
# Every key is OPTIONAL; defaults apply when omitted.
# See docs/config_cookbook.md for all profiles.
# Note: running on CPU — generation will be ~10x slower.
# Consider installing Ollama with GPU acceleration for production use.

profile = "laptop"

[sources]
openapi = [
  "mut_spec.json",
  "stripe_spec.json",
  "stub/target_spec.json",
  # Add more specs as needed: "./path/to/spec.yaml"
]
# traffic = ["./capture.har"]
# db_schema = []

[substrate]
egress = "internal"           # none | internal | any

[substrate.tiers.small]
provider = "ollama"
model = "qwen2.5-coder:3b"

[substrate.tiers.deep]
provider = "ollama"
model = "qwen2.5-coder:3b"

[substrate.tiers.vision]
provider = "ollama"
model = "qwen2.5-coder:3b"     # fallback: qwen2.5-vl:7b not pulled

[substrate.budgets]
max_cost_usd_per_run = 0.0    # 0 = local only
max_latency_ms = 120000

[divergence]
space = ["D1", "D2", "D3", "D4", "D5"]
adversarial_self_play = true
min_severity = "low"

[artifacts]
emitters = ["playwright"]
eject = true

[oracle]
kind = "spec+prism"

[continuity]
mode = "one-shot"             # one-shot | daemon
behavioral_diff_on_pr = false

[copilot]
# Manual-QA pillar (E10). Autonomy ladder grows in E13.
autonomy = "agentic"         # assisted | augmented | agentic | predictive
mentor_enabled = true         # E13: Mentor surfaces senior idioms to juniors

[certification]
# E12: Model Certification + Governance
gold_set_path = ".cherenkov/gold_set.json"
min_faithfulness = 0.8

[credentials.test-auth]
headers = { Authorization = "Bearer test-token" }

[brainmap]
# Knowledge cartography (`cherenkov brain`). Every key is optional; these
# excludes are added to the built-in defaults, not replacing them.
excludes = [
  "agent_memory/**",        # synced machine state, not human-facing knowledge
  ".agents/**",             # per-agent scratch reports
  "stub/generated_tests/**", # generated fixtures
  "docs/_archive/**",       # frozen history — links there are meant to rot
  "docs/archive/**",
  "**/site-packages/**",
]
symbol_depth = "class"      # module | class | function
vault_path = "brain-vault"

# Corpora: files read as data, never executed. Their generated-suite imports
# (`../client`) resolve only once a suite is ejected, so unresolved references
# from these trees are expected rather than broken. Verified: `run_demo.sh`
# drives the Python suites through integrity_check.py, and bench/runner.py
# reads every .spec.ts as text — neither ever invokes Playwright on them.
fixture_roots = [
  "bench/fixtures",
  "demos/catch-the-ai-cheating",
  "demos/live-case-data",
  "tests/eject_fixtures",
  "tests/fixtures",
]
