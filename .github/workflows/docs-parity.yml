name: Docs Parity
on:
  pull_request:
    paths:
      - 'cherenkov/cli/**'
      - 'cherenkov/__main__.py'
      - 'docs/GETTING_STARTED.md'
      - 'scripts/check_cli_docs.py'
  push:
    branches: [main]
    paths:
      - 'cherenkov/cli/**'
      - 'cherenkov/__main__.py'
      - 'docs/GETTING_STARTED.md'
      - 'scripts/check_cli_docs.py'

jobs:
  check-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check CLI ↔ docs parity
        run: python3 scripts/check_cli_docs.py
