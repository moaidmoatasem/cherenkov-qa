name: Docs Link Checker

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays at midnight

# Two modes on purpose.
#
# On push/PR the checker runs OFFLINE: it resolves relative links between files in
# the repo and nothing else. That is deterministic, finishes in well under a second,
# and every failure it reports is caused by the diff under review — so it is safe to
# block on.
#
# External URLs are checked only on the weekly schedule, where a failure files an
# issue instead of blocking anyone. Third-party links 404 when a project is renamed,
# time out, or 302 to a login page; none of that is the fault of the pull request
# that happens to be open, and a gate that goes red for reasons the author cannot
# fix is a gate people learn to ignore.
#
# Shared exclusions:
#   docs/_archive, docs/archive — frozen historical records. CLAUDE.md says not to
#     read _archive/ROADMAP_RECONCILIATION.md as truth; rewriting its links would
#     falsify the history it exists to preserve.
#   cherenkov/web/ui/dist    — build output.
#   docs-site, landing-page  — separate sites that validate their own links;
#     docs-site uses mkdocs '{{ config.site_url }}' template variables, which are
#     not URLs at all.
#   localhost / 127.0.0.1 / ollama — example hosts printed in documentation. They
#     are illustrations, never links, and must never be dialled.

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker (internal links, blocking)
        if: github.event_name != 'schedule'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir "$GITHUB_WORKSPACE" --offline --verbose --no-progress
            --exclude-path node_modules
            --exclude-path docs/_archive
            --exclude-path docs/archive
            --exclude-path cherenkov/web/ui/dist
            --exclude-path docs-site
            --exclude-path landing-page
            './**/*.md' './**/*.html'
          fail: true

      - name: Link Checker (internal + external, weekly report)
        if: github.event_name == 'schedule'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir "$GITHUB_WORKSPACE" --verbose --no-progress
            --max-retries 3 --timeout 30
            --exclude-path node_modules
            --exclude-path docs/_archive
            --exclude-path docs/archive
            --exclude-path cherenkov/web/ui/dist
            --exclude-path docs-site
            --exclude-path landing-page
            --exclude '^https?://localhost'
            --exclude '^https?://127\.0\.0\.1'
            --exclude '^https?://ollama:'
            './**/*.md' './**/*.html'
          fail: false
          output: lychee/out.md

      - name: Create Issue From File
        if: env.lychee_exit_code != 0 && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue
