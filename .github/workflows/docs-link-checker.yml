name: Docs Link Checker

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays at midnight

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        # lychee v2 rejects `--base .` outright ("Base must either be a full URL
        # (with scheme) or an absolute local path"), so the action exited 2 before
        # scanning a single file — this gate had never actually run. Use
        # --root-dir with an absolute path instead.
        #
        # docs/_archive/ and docs/archive/ are excluded on purpose: they are frozen
        # historical records (CLAUDE.md explicitly says not to read
        # docs/_archive/ROADMAP_RECONCILIATION.md as truth), so rewriting their
        # links would falsify the history they exist to preserve.
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir "$GITHUB_WORKSPACE" --verbose --no-progress
            --exclude-path node_modules
            --exclude-path docs/_archive
            --exclude-path docs/archive
            --exclude-path cherenkov/web/ui/dist
            --exclude-path docs-site
            --exclude-path landing-page
            './**/*.md' './**/*.html'
          fail: true

      - name: Create Issue From File
        if: env.lychee_exit_code != 0 && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue
