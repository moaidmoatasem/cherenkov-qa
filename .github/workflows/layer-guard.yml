name: Architecture: Enforce Stack Layer Boundaries

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: layer-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

env:
  # Stack boundary enforcement matrix
  # Each stack strategy defines which files can be modified by which layer
  LAYER_BOUNDARIES: |
    functional:
      "01-contracts": "^src/core/contracts\.py$|^src/ports/|\^prisma/|\^migration/"
      "02-adapters": "^src/adapters/|\^src/cli/|\^src/web/|\^tests/integration/"
      "03-use-cases": "^src/use_cases/|\^src/domain/|\^tests/unit/"
      "04-cli-api": "^src/api/|\^src/services/|\^src/chat/|\^tests/e2e/"
    refactor_first:
      "01-refactor": "^src/core/\^src/adapters/|\^src/use_cases/|\^src/api/|\^src/cli/\^src/web/"
      "02-feature": "^src/(new_|additional_)/"
    risk_isolated:
      "01-risk": "^src/(auth|security|payment|audit|compliance)/"
      "02-normal": "^src/(business_logic|data_access|presentation)/"

jobs:
  detect-stack-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine PR layer and strategy
        id: detect-stack
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"

          # Detect stack strategy based on branch naming patterns
          if [[ "$BRANCH_NAME" =~ ^feat/(01-contracts|02-adapters|03-use-cases|04-cli-api) ]]; then
            STRATEGY="functional"
            LAYER="${BRANCH_NAME#feat/}"
            LAYER_TYPE="functional"
          elif [[ "$BRANCH_NAME" =~ ^refactor/(01-refactor|02-feature) ]]; then
            STRATEGY="refactor_first"
            LAYER="${BRANCH_NAME#refactor/}"
            LAYER_TYPE="refactor_first"
          elif [[ "$BRANCH_NAME" =~ ^(01-risk|02-normal)$ ]]; then
            STRATEGY="risk_isolated"
            LAYER="$BRANCH_NAME"
            LAYER_TYPE="risk_isolated"
          else
            STRATEGY="unknown"
            LAYER="general"
            LAYER_TYPE="general"
          fi

          echo "strategy=$STRATEGY" >> $GITHUB_OUTPUT
          echo "layer=$LAYER" >> $GITHUB_OUTPUT
          echo "type=$LAYER_TYPE" >> $GITHUB_OUTPUT

          # Detect stack membership using GitHub's internal ref
          if [[ "$BASE_REF" == "refs/pull/*/merge" ]]; then
            echo "is_in_stack=true" >> $GITHUB_OUTPUT
            echo "stack_position=mid_stack" >> $GITHUB_OUTPUT
          else
            echo "is_in_stack=false" >> $GITHUB_OUTPUT
            echo "stack_position=null" >> $GITHUB_OUTPUT
          fi

      - name: Validate layer boundaries
        if: needs.detect-stack.outputs.is_in_stack == 'true' && needs.detect-stack.outputs.strategy != 'unknown'
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          STRATEGY="${{ needs.detect-stack.outputs.strategy }}"
          LAYER="${{ needs.detect-stack.outputs.layer }}"
          LAYER_TYPE="${{ needs.detect-stack.outputs.type }}"

          # Get changed files
          CHANGED_FILES=$(gh pr diff "$PR_NUMBER" --name-only)

          # Load boundaries from environment
          BOUNDARIES_JSON="$LAYER_BOUNDARIES"

          # Parse JSON (using python for robustness)
          python3 -c "
          import json, re
          boundaries = json.loads('''$BOUNDARIES_JSON''')
          strategy = '''$STRATEGY'''
          layer = '''$LAYER'''

          if strategy not in boundaries:
            print('Error: Unknown strategy')
            exit(1)

          layer_pattern = boundaries[strategy].get(layer)
          if not layer_pattern:
            print(f'Warning: No pattern defined for layer {layer} in strategy {strategy}')
            exit(0)

          violations = []
          for file in '''$CHANGED_FILES'''.split('\n'):
            if file and not file.startswith('.'):
              if not re.match(layer_pattern, file):
                violations.append(file)

          if violations:
            print('LAYER VIOLATION DETECTED:')
            for v in violations:
              print(f'  - {v}')
            print()
            print(f'Layer {layer} in strategy {strategy} attempted to modify files outside its boundary.')
            print('This may indicate an architectural drift or incomplete refactoring.')
            exit(1)
          else:
            print('✅ Layer boundaries validated successfully')
          "

      - name: Post violation comment to PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const prNumber = ${{ github.event.pull_request.number }}
            const repo = ${{ github.repository }}
            const strategy = '${{ needs.detect-stack.outputs.strategy }}'
            const layer = '${{ needs.detect-stack.outputs.layer }}'

            const commentBody = `
## 🚨 Layer Boundary Violation Detected

**Action Required:** Fix architectural boundary violations in PR #${prNumber}

- **Stack Strategy:** ${strategy}
- **Affected Layer:** ${layer}
- **Issue:** Files modified outside the defined architectural layer boundaries

### What This Means

Each stack layer is architecturally isolated to maintain:
- **Clear separation of concerns** (contracts → adapters → use cases → api)
- **Logical dependency order** (no forward references)
- **Reviewable diffs** (small, focused changes per layer)

### Recommended Fix

1. Identify files violating boundary constraints
2. Create separate PR layer for affected code changes
3. Ensure backward compatibility is maintained across layers

### Next Steps

Run the layer guard workflow again after fixing violations, or contact the architecture team for guidance.

---
*Automated Layer Guard — Generated by CHERENKOV Stacked PR Engine*
            `

            github.rest.issues.createComment({
              owner: repo.split('/')[0],
              repo: repo.split('/')[1],
              issue_number: prNumber,
              body: commentBody,
            });

      - name: Validate stack inheritance and context
        if: needs.detect-stack.outputs.is_in_stack == 'true'
        run: |
          echo "Validating stack inheritance chains and context integrity..."

          # Check that SDD context exists for stack validation
          CONTEXT_FILE="${{ github.workspace }}/agent_memory/sync/context.json"
          if [[ -f "$CONTEXT_FILE" ]]; then
            echo "✅ SDD context found for stack validation"
            # Validate that context includes stack-specific information
            STACK_INSIGHTS=$(python3 -c "
            import json, sys
            try:
                data = json.load(open('$CONTEXT_FILE'))
                if 'stacks' in data:
                    print('Stacks context found')
                    print(f'Tracked stacks: {len(data[\"stacks\"])}')
                else:
                    print('Warning: No stacks context found')
            except Exception as e:
                print(f'Error reading context: {e}')
                sys.exit(1)
            " 2>/dev/null || echo "⚠️ Could not validate SDD context")
          else
            echo "⚠️ No SDD context file found - stack may be independent"
          fi

      - name: Post stack validation status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ github.event.pull_request.number }}
            const repo = ${{ github.repository }}
            const strategy = '${{ needs.detect-stack.outputs.strategy }}'
            const layer = '${{ needs.detect-stack.outputs.layer }}'
            const isInStack = '${{ needs.detect-stack.outputs.is_in_stack }}'

            let statusMessage = ''
            if (isInStack === 'true') {
              statusMessage = `**Stack Validation**: PR #${prNumber} is part of a ${strategy} stack (Layer: ${layer})`;
            } else {
              statusMessage = `**Stack Validation**: PR #${prNumber} is a standalone PR (no stack context)`;
            }

            github.rest.issues.createComment({
              owner: repo.split('/')[0],
              repo: repo.split('/')[1],
              issue_number: prNumber,
              body: `### 🏗️ Stacked PR Architecture Status\n\n${statusMessage}\n\n---\n*Stacked PR Engine - Automated Architecture Validation*`
            });
