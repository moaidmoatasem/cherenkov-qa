name: "Architecture: Enforce Stack Layer Boundaries"

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: layer-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  validate-layer-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Checks the ADR-004 dependency rule by parsing imports, not by inspecting
      # which files a PR happened to touch. The previous implementation failed
      # any PR that changed a core/ports file and an adapters/web/cli file
      # together — a co-change heuristic that blocked legitimate vertical slices
      # (5 of the 21 commits touching cherenkov/*.py in the 50 preceding this
      # change would have failed it) while never checking the rule it named: a
      # core file importing cherenkov.web passed clean if nothing else changed.
      - name: Validate layer boundaries
        id: validate
        run: python3 scripts/check_layer_imports.py

      - name: Post violation comment to PR
        if: failure() && github.event.pull_request.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = '${{ github.event.pull_request.number }}'
            const repo = '${{ github.repository }}'

            const commentBody = `## 🚨 Layer Boundary Violation Detected

            **Action Required:** Fix architectural boundary violations in PR #${prNumber}

            **Issue:** Files modified that mix core/ports (domain logic) with adapters/web/cli/api (infrastructure) in a single change.

            ### What This Means

            Clean architecture (ADR-004) requires:
            - **Clear separation of concerns** (contracts → ports → adapters → cli/web)
            - **Logical dependency order** (no forward references)
            - **Reviewable diffs** (small, focused changes per layer)

            ### Recommended Fix

            1. Split this PR so domain/core changes and infrastructure changes land separately
            2. Ensure backward compatibility is maintained across layers
            3. Re-run the layer guard workflow after splitting

            ---
            *Automated Layer Guard — Generated by CHERENKOV Layer Guard*
            `

            github.rest.issues.createComment({
              owner: repo.split('/')[0],
              repo: repo.split('/')[1],
              issue_number: prNumber,
              body: commentBody,
            });
