name: Headless QA User Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # nightly at 2 AM UTC
  pull_request:
    types: [labeled]
    branches: [main]

jobs:
  headless-qa-shard-1:
    name: QA User Tests — Shard 1 (Setup + Divergence)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'qa-headless')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cherenkov/web/ui/package-lock.json

      - name: Install Python deps
        run: |
          pip install -e .
          pip install pytest pytest-cov

      - name: Install UI deps
        run: |
          cd cherenkov/web/ui
          npm ci

      - name: Install Playwright browsers
        run: |
          cd cherenkov/web/ui
          npx playwright install chromium

      - name: Start backend
        run: |
          python -m cherenkov review review --port 8001 &
          sleep 10
          curl -f http://localhost:8001/api/v1/health

      - name: Run Playwright tests (Shard 1)
        run: |
          cd cherenkov/web/ui
          npx playwright test tests/qa/headless-qa-user.spec.ts \
            -g "Backend Guard|Spec Setup|Divergence" \
            --reporter=list \
            --shard=1/2

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-1
          path: cherenkov/web/ui/test-results/

  headless-qa-shard-2:
    name: QA User Tests — Shard 2 (Chat + Settings + Stress)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'qa-headless')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cherenkov/web/ui/package-lock.json

      - name: Install Python deps
        run: |
          pip install -e .
          pip install pytest pytest-cov

      - name: Install UI deps
        run: |
          cd cherenkov/web/ui
          npm ci

      - name: Install Playwright browsers
        run: |
          cd cherenkov/web/ui
          npx playwright install chromium

      - name: Start backend
        run: |
          python -m cherenkov review review --port 8001 &
          sleep 10
          curl -f http://localhost:8001/api/v1/health

      - name: Run Playwright tests (Shard 2)
        run: |
          cd cherenkov/web/ui
          npx playwright test tests/qa/headless-qa-user.spec.ts \
            -g "Chat|Settings|Stress" \
            --reporter=list \
            --shard=2/2

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-shard-2
          path: cherenkov/web/ui/test-results/