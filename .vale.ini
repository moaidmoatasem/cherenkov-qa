# Vale configuration file for CHERENKOV QA Docs-as-Code

StylesPath = .github/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Google

# Ignore code blocks and inline code
TokenIgnores = (`[^`]+`)

# Enforce active voice and clear imperative style
Google.Passive = suggestion
Google.We = suggestion
Google.FirstPerson = suggestion
Google.Wordiness = warning
Google.Gender = error
Google.Inclusive = error
