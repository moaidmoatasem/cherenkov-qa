$schema: "https://json.schemastore.org/smithery.json"
# Smithery configuration for the CHERENKOV QA MCP Server.
# Deploy config: Smithery builds and runs `cherenkov mcp serve`.
# Declare targetUrl / specPath via configSchema when publishing.
name: "@cherenkov/qa"
displayName: "CHERENKOV QA MCP Server"
description: "AI-native API conformance testing framework with spec-driven test generation, drift detection, and HITL review over MCP."
version: "1.3.0"
startCommand: "cherenkov mcp serve"
configSchema:
  type: object
  properties:
    targetUrl:
      type: string
      description: "Base URL of the API to test"
    specPath:
      type: string
      description: "Path to the OpenAPI spec"
