name: CHERENKOV Conformance Check
description: >
  Generate and run API conformance tests from your OpenAPI spec.
  Catches spec drift before it reaches production.
author: Moayed Badawy

branding:
  icon: shield
  color: blue

inputs:
  spec:
    description: Path to OpenAPI spec file (YAML or JSON)
    required: true
  target:
    description: API server URL to test against
    required: true
  fail-on-drift:
    description: Exit with code 1 if any conformance violations are found
    required: false
    default: "true"
  llm-provider:
    description: LLM provider (openai | ollama)
    required: false
    default: openai
  llm-model:
    description: Model name (e.g. gpt-4o-mini, qwen2.5-coder:7b)
    required: false
    default: gpt-4o-mini
  output-format:
    description: Output format (json | sarif | junit | html)
    required: false
    default: sarif
  output-path:
    description: Path for the output report file
    required: false
    default: cherenkov-report.sarif
  pr-number:
    description: Pull request number for PR comment integration
    required: false
  pr-title:
    description: Pull request title
    required: false
  pr-description:
    description: Pull request description
    required: false
  commit-sha:
    description: Commit SHA being checked
    required: false
  head-branch:
    description: Head branch name
    required: false
  base-branch:
    description: Base branch name
    required: false
  deeplink:
    description: URL to a per-PR dynamic preview environment
    required: false
  artifact-url:
    description: URL to build artifacts
    required: false
  artifact-filename:
    description: Filename for build artifacts
    required: false

outputs:
  violations:
    description: Number of conformance violations found
    value: ${{ steps.run.outputs.violations }}
  report-path:
    description: Path to the generated conformance report
    value: ${{ steps.run.outputs.report-path }}
  sarif-path:
    description: Path to SARIF output (for GitHub Security tab)
    value: ${{ steps.run.outputs.sarif-path }}
  sarif:
    description: Path to SARIF output report
    value: ${{ steps.run.outputs.sarif }}
  sarif_report:
    description: Path to SARIF output report
    value: ${{ steps.run.outputs.sarif_report }}
  drift-detected:
    description: true if any conformance violations were found
    value: ${{ steps.run.outputs.drift-detected }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install CHERENKOV
      shell: bash
      run: pip install "${{ github.action_path }}" --quiet

    - name: Run conformance check
      id: run
      shell: bash
      env:
        OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
        # These are the names cherenkov/core/settings.py actually reads.
        # CHERENKOV_LLM_PROVIDER / CHERENKOV_LLM_MODEL do not exist anywhere in
        # the package: setting them was a silent no-op, so `llm-provider: openai`
        # still ran against the Ollama default. Guarded by
        # tests/unit/test_action_env_names.py.
        PROVIDER: ${{ inputs.llm-provider }}
        GEN_MODEL: ${{ inputs.llm-model }}
      run: |
        set +e
        OUTPUT_FILE="${{ inputs.output-path }}"
        FORMAT="${{ inputs.output-format }}"
        cherenkov validate \
          --spec "${{ inputs.spec }}" \
          --target "${{ inputs.target }}" \
          --output "${OUTPUT_FILE}" \
          --format "${FORMAT}" \
          --json-summary /tmp/cherenkov-summary.json \
          ${{ inputs.pr-number && format('--pr-number "{0}"', inputs.pr-number) || '' }} \
          ${{ inputs.pr-title && format('--pr-title "{0}"', inputs.pr-title) || '' }} \
          ${{ inputs.pr-description && format('--pr-description "{0}"', inputs.pr-description) || '' }} \
          ${{ inputs.commit-sha && format('--commit-sha "{0}"', inputs.commit-sha) || '' }} \
          ${{ inputs.head-branch && format('--head-branch "{0}"', inputs.head-branch) || '' }} \
          ${{ inputs.base-branch && format('--base-branch "{0}"', inputs.base-branch) || '' }} \
          ${{ inputs.deeplink && format('--deeplink "{0}"', inputs.deeplink) || '' }} \
          ${{ inputs.artifact-url && format('--artifact-url "{0}"', inputs.artifact-url) || '' }} \
          ${{ inputs.artifact-filename && format('--artifact-filename "{0}"', inputs.artifact-filename) || '' }}
        VIOLATIONS=0
        DRIFT_DETECTED=false
        if [ -f /tmp/cherenkov-summary.json ]; then
          VIOLATIONS=$(python3 -c "import json; print(json.load(open('/tmp/cherenkov-summary.json')).get('violation_count',0))" 2>/dev/null || echo 0)
          [ "${VIOLATIONS}" -gt 0 ] && DRIFT_DETECTED=true
        fi
        echo "violations=${VIOLATIONS}" >> "$GITHUB_OUTPUT"
        echo "drift-detected=${DRIFT_DETECTED}" >> "$GITHUB_OUTPUT"
        echo "report-path=${OUTPUT_FILE}" >> "$GITHUB_OUTPUT"
        echo "sarif=${OUTPUT_FILE}" >> "$GITHUB_OUTPUT"
        echo "sarif_report=${OUTPUT_FILE}" >> "$GITHUB_OUTPUT"
        [ "${FORMAT}" = "sarif" ] && echo "sarif-path=${OUTPUT_FILE}" >> "$GITHUB_OUTPUT"
        printf "CHERENKOV: %s violation(s) detected.\n" "${VIOLATIONS}"
        if [ "${{ inputs.fail-on-drift }}" = "true" ] && [ "${DRIFT_DETECTED}" = "true" ]; then
          echo "Failing build (fail-on-drift=true)."; exit 1
        fi
