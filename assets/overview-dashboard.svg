<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#0b0f19; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Header -->
  <rect x="0" y="0" width="1000" height="54" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="27" r="12" fill="#6366f1"/>
  <text x="28" y="32" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
  <text x="50" y="32" font-size="16" font-weight="700" fill="#f8fafc" letter-spacing="0.5">CHERENKOV<tspan fill="#818cf8">-QA</tspan></text>
  <rect x="195" y="18" width="52" height="18" rx="9" fill="#312e81"/>
  <text x="221" y="31" font-size="10" font-weight="700" fill="#c7d2fe" text-anchor="middle">v1.4.0</text>

  <!-- Navigation Tabs -->
  <g transform="translate(280, 16)">
    <rect x="0" y="0" width="90" height="24" rx="4" fill="#3730a3"/>
    <text x="45" y="16" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Overview</text>
    
    <text x="145" y="16" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Author &amp; Gen</text>
    <text x="240" y="16" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Triage Queue</text>
    <text x="345" y="16" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Coverage &amp; Cert</text>
    <text x="445" y="16" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">Second Brain</text>
  </g>

  <!-- Status / Health Badge -->
  <g transform="translate(830, 16)">
    <rect x="0" y="0" width="145" height="24" rx="12" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#10b981"/>
    <text x="26" y="16" font-size="11" font-weight="600" fill="#6ee7b7">Guardian: ACTIVE</text>
  </g>

  <!-- Main Container -->
  <!-- 4 Metric Cards -->
  <g transform="translate(30, 75)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="215" height="95" rx="8" fill="url(#grad-card)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="18" y="28" font-size="12" font-weight="600" fill="#94a3b8">ENDPOINTS AUDITED</text>
    <text x="18" y="65" font-size="30" font-weight="800" fill="#f8fafc">48 / 48</text>
    <text x="18" y="84" font-size="11" font-weight="500" fill="#10b981">✓ 100% Spec Discovered</text>
    <circle cx="185" cy="45" r="16" fill="#1e1b4b"/>
    <text x="185" y="50" font-size="16" fill="#818cf8" text-anchor="middle">⚡</text>

    <!-- Card 2 -->
    <rect x="242" y="0" width="215" height="95" rx="8" fill="url(#grad-card)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="260" y="28" font-size="12" font-weight="600" fill="#94a3b8">CONFORMANCE RATE</text>
    <text x="260" y="65" font-size="30" font-weight="800" fill="#10b981">98.4%</text>
    <text x="260" y="84" font-size="11" font-weight="500" fill="#10b981">↑ +2.1% from baseline</text>
    <circle cx="427" cy="45" r="16" fill="#064e3b"/>
    <text x="427" y="50" font-size="16" fill="#34d399" text-anchor="middle">🛡️</text>

    <!-- Card 3 -->
    <rect x="484" y="0" width="215" height="95" rx="8" fill="url(#grad-card)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="502" y="28" font-size="12" font-weight="600" fill="#94a3b8">ACTIVE DIVERGENCES</text>
    <text x="502" y="65" font-size="30" font-weight="800" fill="#f8fafc">0</text>
    <text x="502" y="84" font-size="11" font-weight="500" fill="#38bdf8">✓ All claims reconciled</text>
    <circle cx="669" cy="45" r="16" fill="#0c4a6e"/>
    <text x="669" y="50" font-size="16" fill="#38bdf8" text-anchor="middle">🔍</text>

    <!-- Card 4 -->
    <rect x="726" y="0" width="215" height="95" rx="8" fill="url(#grad-card)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="744" y="28" font-size="12" font-weight="600" fill="#94a3b8">OVERALL VERDICT</text>
    <text x="744" y="65" font-size="24" font-weight="800" fill="#a855f7">CERTIFIED</text>
    <text x="744" y="84" font-size="11" font-weight="500" fill="#c084fc">Signed Certificate: #4C5B4F</text>
    <circle cx="911" cy="45" r="16" fill="#3b0764"/>
    <text x="911" y="50" font-size="16" fill="#c084fc" text-anchor="middle">📜</text>
  </g>

  <!-- Left Panel: Live Conformance Pipeline & Health Stream -->
  <g transform="translate(30, 190)">
    <rect x="0" y="0" width="580" height="400" rx="8" fill="url(#grad-card)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    
    <text x="20" y="32" font-size="15" font-weight="700" fill="#f8fafc">Live Conformance Stream &amp; Drift Monitor</text>
    <text x="20" y="50" font-size="11" fill="#94a3b8">Continuous background verification powered by LocalAI Substrate Router</text>
    
    <!-- Table Header -->
    <rect x="20" y="70" width="540" height="30" rx="4" fill="#0f172a"/>
    <text x="35" y="90" font-size="11" font-weight="600" fill="#64748b">METHOD</text>
    <text x="115" y="90" font-size="11" font-weight="600" fill="#64748b">ENDPOINT PATH</text>
    <text x="300" y="90" font-size="11" font-weight="600" fill="#64748b">SPEC STATUS</text>
    <text x="400" y="90" font-size="11" font-weight="600" fill="#64748b">LATENCY</text>
    <text x="480" y="90" font-size="11" font-weight="600" fill="#64748b">VERDICT</text>

    <!-- Row 1 -->
    <rect x="30" y="112" width="48" height="18" rx="4" fill="#065f46"/>
    <text x="54" y="125" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">GET</text>
    <text x="115" y="126" font-size="12" font-weight="500" fill="#e2e8f0">/api/v1/coverage/map</text>
    <text x="300" y="126" font-size="12" fill="#94a3b8">200 OK</text>
    <text x="400" y="126" font-size="12" fill="#94a3b8">24ms</text>
    <text x="480" y="126" font-size="11" font-weight="700" fill="#10b981">PASSED</text>

    <!-- Row 2 -->
    <rect x="30" y="152" width="48" height="18" rx="4" fill="#1e3a8a"/>
    <text x="54" y="165" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">POST</text>
    <text x="115" y="166" font-size="12" font-weight="500" fill="#e2e8f0">/api/v1/auth/saml/login</text>
    <text x="300" y="166" font-size="12" fill="#94a3b8">302 Redirect</text>
    <text x="400" y="166" font-size="12" fill="#94a3b8">48ms</text>
    <text x="480" y="166" font-size="11" font-weight="700" fill="#10b981">PASSED</text>

    <!-- Row 3 -->
    <rect x="30" y="192" width="48" height="18" rx="4" fill="#065f46"/>
    <text x="54" y="205" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">GET</text>
    <text x="115" y="206" font-size="12" font-weight="500" fill="#e2e8f0">/api/v1/guardian/drift</text>
    <text x="300" y="206" font-size="12" fill="#94a3b8">200 OK</text>
    <text x="400" y="206" font-size="12" fill="#94a3b8">18ms</text>
    <text x="480" y="206" font-size="11" font-weight="700" fill="#10b981">PASSED</text>

    <!-- Row 4 -->
    <rect x="30" y="232" width="48" height="18" rx="4" fill="#854d0e"/>
    <text x="54" y="245" font-size="10" font-weight="700" fill="#facc15" text-anchor="middle">PUT</text>
    <text x="115" y="246" font-size="12" font-weight="500" fill="#e2e8f0">/api/v1/knowledge/idiom</text>
    <text x="300" y="246" font-size="12" fill="#94a3b8">200 OK</text>
    <text x="400" y="246" font-size="12" fill="#94a3b8">36ms</text>
    <text x="480" y="246" font-size="11" font-weight="700" fill="#10b981">PASSED</text>

    <!-- Row 5 -->
    <rect x="30" y="272" width="48" height="18" rx="4" fill="#701a75"/>
    <text x="54" y="285" font-size="10" font-weight="700" fill="#f472b6" text-anchor="middle">DELETE</text>
    <text x="115" y="286" font-size="12" font-weight="500" fill="#e2e8f0">/api/v1/sessions/{id}</text>
    <text x="300" y="286" font-size="12" fill="#94a3b8">204 No Content</text>
    <text x="400" y="286" font-size="12" fill="#94a3b8">15ms</text>
    <text x="480" y="286" font-size="11" font-weight="700" fill="#10b981">PASSED</text>

    <!-- Sub-status footer -->
    <rect x="20" y="325" width="540" height="55" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="35" y="348" font-size="12" font-weight="600" fill="#f8fafc">Continuous Conformance Daemon</text>
    <text x="35" y="366" font-size="11" fill="#64748b">Last full sweep completed in 1.42s • 0 regressions detected • Gate Threshold: 0.80</text>
  </g>

  <!-- Right Panel: Second Brain & Knowledge Mesh -->
  <g transform="translate(630, 190)">
    <rect x="0" y="0" width="340" height="400" rx="8" fill="url(#grad-card)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="20" y="32" font-size="15" font-weight="700" fill="#f8fafc">Second Brain &amp; Mesh</text>
    <text x="20" y="50" font-size="11" fill="#94a3b8">SQLite FTS5 + GraphRAG Knowledge</text>

    <!-- Mesh Metric Item 1 -->
    <g transform="translate(20, 75)">
      <rect x="0" y="0" width="300" height="50" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="15" y="22" font-size="12" font-weight="600" fill="#f8fafc">Learned QA Idioms</text>
      <text x="15" y="38" font-size="11" fill="#64748b">128 active test patterns</text>
      <text x="260" y="32" font-size="16" font-weight="700" fill="#6366f1" text-anchor="end">128</text>
    </g>

    <!-- Mesh Metric Item 2 -->
    <g transform="translate(20, 135)">
      <rect x="0" y="0" width="300" height="50" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="15" y="22" font-size="12" font-weight="600" fill="#f8fafc">Indexed Verdict Records</text>
      <text x="15" y="38" font-size="11" fill="#64748b">verdicts.db (FTS5 shadow table)</text>
      <text x="260" y="32" font-size="16" font-weight="700" fill="#10b981" text-anchor="end">2,410</text>
    </g>

    <!-- Mesh Metric Item 3 -->
    <g transform="translate(20, 195)">
      <rect x="0" y="0" width="300" height="50" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="15" y="22" font-size="12" font-weight="600" fill="#f8fafc">MCP Tool Mesh</text>
      <text x="15" y="38" font-size="11" fill="#64748b">41 tools registered / 6 resources</text>
      <text x="260" y="32" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="end">41 Tools</text>
    </g>

    <!-- Quick Eject Banner -->
    <g transform="translate(20, 260)">
      <rect x="0" y="0" width="300" height="120" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="15" y="24" font-size="12" font-weight="700" fill="#c7d2fe">Zero Lock-In Eject Guarantee</text>
      <text x="15" y="44" font-size="11" fill="#e0e7ff">Generate 100% native Playwright TypeScript tests that run independently of CHERENKOV.</text>
      <rect x="15" y="75" width="130" height="28" rx="4" fill="#6366f1"/>
      <text x="80" y="93" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">cherenkov eject</text>
    </g>
  </g>
</svg>
