      <text x="35" y="14" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">GET</text>
      <text x="95" y="15" font-size="12" font-family="monospace" fill="#f8fafc">/api/v1/coverage/regressions</text>
      <text x="330" y="15" font-size="12" fill="#94a3b8">200, 404</text>
      
      <!-- Progress Bar -->
