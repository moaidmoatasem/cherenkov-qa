<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%" style="background:#0b0f19; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="m-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="m-cert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="m-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Top Bar -->
  <rect x="0" y="0" width="950" height="50" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="30" y="31" font-size="15" font-weight="700" fill="#f8fafc">API Conformance Coverage Matrix <tspan fill="#818cf8">• GET /api/v1/coverage/map</tspan></text>
  
  <g transform="translate(730, 13)">
    <rect x="0" y="0" width="190" height="24" rx="12" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#10b981"/>
    <text x="26" y="16" font-size="11" font-weight="600" fill="#6ee7b7">COVERAGE: 98.4% (PASS)</text>
  </g>

  <!-- Main Table Container -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="890" height="455" rx="8" fill="url(#m-card)" stroke="#334155" stroke-width="1" filter="url(#m-shadow)"/>

    <!-- Certificate Badge Header -->
    <g transform="translate(25, 20)">
      <rect x="0" y="0" width="840" height="60" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <circle cx="30" cy="30" r="16" fill="#047857"/>
      <text x="30" y="36" font-size="18" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="60" y="27" font-size="13" font-weight="800" fill="#ffffff">CHERENKOV CONFORMANCE CERTIFIED (v1.4.0)</text>
      <text x="60" y="47" font-size="11" fill="#a7f3d0">Certificate Fingerprint: SHA256:4C5B4F2E9A88102C • SAMA/CBE Conformance Grade: A+</text>
      
      <rect x="710" y="16" width="115" height="28" rx="4" fill="#10b981"/>
      <text x="767" y="34" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">VERIFY CERT</text>
    </g>

    <!-- Table Header -->
