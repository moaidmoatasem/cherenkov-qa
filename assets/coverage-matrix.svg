      <rect x="0" y="0" width="840" height="32" rx="4" fill="#0f172a"/>
      <text x="15" y="21" font-size="11" font-weight="700" fill="#64748b">METHOD</text>
      <text x="95" y="21" font-size="11" font-weight="700" fill="#64748b">ENDPOINT PATH</text>
      <text x="330" y="21" font-size="11" font-weight="700" fill="#64748b">STATUS CODES TESTED</text>
      <text x="510" y="21" font-size="11" font-weight="700" fill="#64748b">MUTATION COVERAGE</text>
      <text x="680" y="21" font-size="11" font-weight="700" fill="#64748b">LAST VERDICT</text>
      <text x="780" y="21" font-size="11" font-weight="700" fill="#64748b">CERTIFIED</text>
    </g>

    <!-- Table Rows -->
    <!-- Row 1 -->
    <g transform="translate(25, 137)">
      <rect x="10" y="0" width="50" height="20" rx="4" fill="#065f46"/>
      <text x="35" y="14" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">GET</text>
      <text x="95" y="15" font-size="12" font-family="monospace" fill="#f8fafc">/api/v1/coverage/map</text>
      <text x="330" y="15" font-size="12" fill="#94a3b8">200, 401, 500</text>
      
      <!-- Progress Bar -->
