      <rect x="510" y="4" width="90" height="12" rx="3" fill="#10b981"/>
      <text x="620" y="15" font-size="11" font-weight="600" fill="#10b981">90%</text>
      
      <text x="680" y="15" font-size="11" font-weight="700" fill="#10b981">CERTIFIED</text>
      <text x="795" y="15" font-size="12" fill="#10b981">✓</text>
    </g>
    <line x1="35" y1="287" x2="855" y2="287" stroke="#1e293b"/>

    <!-- Row 5 -->
    <g transform="translate(25, 297)">
      <rect x="10" y="0" width="50" height="20" rx="4" fill="#701a75"/>
      <text x="35" y="14" font-size="10" font-weight="700" fill="#f472b6" text-anchor="middle">DELETE</text>
      <text x="95" y="15" font-size="12" font-family="monospace" fill="#f8fafc">/api/v1/sessions/{id}</text>
      <text x="330" y="15" font-size="12" fill="#94a3b8">204, 404</text>
      
      <!-- Progress Bar -->
