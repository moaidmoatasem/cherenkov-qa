      <rect x="510" y="4" width="100" height="12" rx="3" fill="#10b981"/>
      <text x="620" y="15" font-size="11" font-weight="600" fill="#10b981">100%</text>
      
      <text x="680" y="15" font-size="11" font-weight="700" fill="#10b981">CERTIFIED</text>
      <text x="795" y="15" font-size="12" fill="#10b981">✓</text>
    </g>
    <line x1="35" y1="167" x2="855" y2="167" stroke="#1e293b"/>

    <!-- Row 2 -->
    <g transform="translate(25, 177)">
      <rect x="10" y="0" width="50" height="20" rx="4" fill="#1e3a8a"/>
      <text x="35" y="14" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">POST</text>
      <text x="95" y="15" font-size="12" font-family="monospace" fill="#f8fafc">/api/v1/coverage/conformance-trend</text>
      <text x="330" y="15" font-size="12" fill="#94a3b8">200, 400, 403</text>
      
      <!-- Progress Bar -->
      <rect x="510" y="4" width="100" height="12" rx="3" fill="#1e293b"/>
      <rect x="510" y="4" width="95" height="12" rx="3" fill="#10b981"/>
      <text x="620" y="15" font-size="11" font-weight="600" fill="#10b981">95%</text>
      
      <text x="680" y="15" font-size="11" font-weight="700" fill="#10b981">CERTIFIED</text>
      <text x="795" y="15" font-size="12" fill="#10b981">✓</text>
    </g>
    <line x1="35" y1="207" x2="855" y2="207" stroke="#1e293b"/>

