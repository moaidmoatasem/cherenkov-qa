      <rect x="510" y="4" width="100" height="12" rx="3" fill="#10b981"/>
      <text x="620" y="15" font-size="11" font-weight="600" fill="#10b981">100%</text>
      
      <text x="680" y="15" font-size="11" font-weight="700" fill="#10b981">CERTIFIED</text>
      <text x="795" y="15" font-size="12" fill="#10b981">✓</text>
    </g>

    <!-- Footer Summary -->
    <g transform="translate(25, 360)">
      <rect x="0" y="0" width="840" height="60" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="20" y="25" font-size="12" font-weight="600" fill="#f8fafc">Matrix Summary</text>
      <text x="20" y="44" font-size="11" fill="#64748b">48/48 Endpoints Conforming • 0 Regressions • 28 Mutation Vectors Tested per Endpoint</text>
      <text x="700" y="35" font-size="12" font-weight="700" fill="#10b981">CI DIFF BOT: ACTIVE</text>
    </g>
