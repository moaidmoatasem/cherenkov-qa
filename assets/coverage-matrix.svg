      <rect x="10" y="0" width="50" height="20" rx="4" fill="#854d0e"/>
      <text x="35" y="14" font-size="10" font-weight="700" fill="#facc15" text-anchor="middle">PUT</text>
      <text x="95" y="15" font-size="12" font-family="monospace" fill="#f8fafc">/api/v1/guardian/config</text>
      <text x="330" y="15" font-size="12" fill="#94a3b8">200, 422</text>
      
      <!-- Progress Bar -->
