<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%" style="background:#0b0f19; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="g-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="g-danger" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="f-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Top Bar -->
  <rect x="0" y="0" width="950" height="50" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="30" y="31" font-size="15" font-weight="700" fill="#f8fafc">Spec Guardian Daemon <tspan fill="#818cf8">• Continuous Drift Inspector</tspan></text>
  
  <g transform="translate(730, 13)">
    <rect x="0" y="0" width="190" height="24" rx="12" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#10b981"/>
    <text x="26" y="16" font-size="11" font-weight="600" fill="#6ee7b7">DAEMON ACTIVE (30s poll)</text>
  </g>

  <!-- Overview Summary Row -->
  <g transform="translate(30, 70)">
    <!-- Daemon Status Card -->
    <rect x="0" y="0" width="280" height="85" rx="8" fill="url(#g-card)" stroke="#334155" stroke-width="1" filter="url(#f-shadow)"/>
    <text x="18" y="24" font-size="11" font-weight="600" fill="#94a3b8">BACKGROUND DAEMON</text>
    <text x="18" y="52" font-size="20" font-weight="700" fill="#f8fafc">cherenkov guardian</text>
    <text x="18" y="72" font-size="11" fill="#10b981">PID: 49102 • SQLite: .cherenkov/guardian.db</text>

    <!-- Drift Detection Stats -->
    <rect x="305" y="0" width="280" height="85" rx="8" fill="url(#g-card)" stroke="#334155" stroke-width="1" filter="url(#f-shadow)"/>
    <text x="323" y="24" font-size="11" font-weight="600" fill="#94a3b8">ENDPOINTS MONITORED</text>
    <text x="323" y="52" font-size="24" font-weight="700" fill="#f8fafc">34 declared</text>
    <text x="323" y="72" font-size="11" fill="#38bdf8">14,280 continuous probes sent</text>

    <!-- Invariant Safety Notice -->
    <rect x="610" y="0" width="280" height="85" rx="8" fill="url(#g-card)" stroke="#4338ca" stroke-width="1" filter="url(#f-shadow)"/>
    <text x="628" y="24" font-size="11" font-weight="600" fill="#a5b4fc">D7 INVARIANT ENFORCED</text>
    <text x="628" y="52" font-size="18" font-weight="700" fill="#e0e7ff">Suggest-Only Healing</text>
    <text x="628" y="72" font-size="11" fill="#c7d2fe">Zero auto-edits to test code</text>
  </g>

  <!-- Detailed Drift Investigation Card -->
  <g transform="translate(30, 175)">
    <rect x="0" y="0" width="890" height="350" rx="8" fill="url(#g-card)" stroke="#334155" stroke-width="1" filter="url(#f-shadow)"/>
    
    <text x="25" y="32" font-size="15" font-weight="700" fill="#f8fafc">Divergence Inspector: Spec vs. Live Reality</text>
    <text x="25" y="50" font-size="11" fill="#94a3b8">Real-time discrepancy detected between OpenAPI specification and upstream service responses</text>

    <!-- Divergence Item Box -->
    <g transform="translate(25, 70)">
      <rect x="0" y="0" width="840" height="150" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
      
      <!-- Method & Endpoint -->
      <rect x="15" y="15" width="55" height="22" rx="4" fill="#1e3a8a"/>
      <text x="42" y="30" font-size="11" font-weight="700" fill="#60a5fa" text-anchor="middle">POST</text>
      <text x="80" y="32" font-size="14" font-weight="700" fill="#f8fafc">/v1/orders/checkout</text>
      
      <!-- Divergence Type Badge -->
      <rect x="680" y="15" width="145" height="22" rx="4" fill="#7f1d1d"/>
      <text x="752" y="30" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">DIVERGENCE DETECTED</text>

      <!-- Side-by-Side Comparison -->
      <!-- Left: Spec Claim -->
      <g transform="translate(15, 50)">
        <rect x="0" y="0" width="395" height="85" rx="4" fill="#1e293b" stroke="#334155"/>
        <text x="12" y="20" font-size="11" font-weight="700" fill="#94a3b8">📄 DECLARED OPENAPI SPEC</text>
        <text x="12" y="42" font-size="12" font-family="monospace" fill="#f8fafc">Status: <tspan fill="#34d399">201 Created</tspan></text>
        <text x="12" y="62" font-size="12" font-family="monospace" fill="#f8fafc">Body: {"order_id": "string", "amount": 0.0}</text>
      </g>

      <!-- Right: Live Reality -->
      <g transform="translate(430, 50)">
        <rect x="0" y="0" width="395" height="85" rx="4" fill="#1e293b" stroke="#7f1d1d"/>
        <text x="12" y="20" font-size="11" font-weight="700" fill="#fca5a5">⚡ LIVE BACKEND REALITY (Witness)</text>
        <text x="12" y="42" font-size="12" font-family="monospace" fill="#f8fafc">Status: <tspan fill="#ef4444">200 OK (drift)</tspan></text>
        <text x="12" y="62" font-size="12" font-family="monospace" fill="#f8fafc">Body: {"id": "string", "amount": 0.0} <tspan fill="#ef4444">(field name diff)</tspan></text>
      </g>
    </g>

    <!-- Suggestion / Resolution Panel -->
    <g transform="translate(25, 235)">
      <rect x="0" y="0" width="840" height="95" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
      <text x="20" y="24" font-size="12" font-weight="700" fill="#c7d2fe">💡 SUGGESTED HEALING REPORT (Non-invasive suggestion)</text>
      <text x="20" y="46" font-size="12" fill="#e0e7ff">1. Spec update candidate: Modify <tspan font-family="monospace" fill="#38bdf8">paths['/v1/orders/checkout'].post.responses['200']</tspan> or reconcile backend controller.</text>
      <text x="20" y="68" font-size="12" fill="#e0e7ff">2. Run <tspan font-family="monospace" fill="#38bdf8">cherenkov triage --id DIV-8812</tspan> to accept suggestion or record in Second Brain idioms.</text>
    </g>
  </g>
</svg>
