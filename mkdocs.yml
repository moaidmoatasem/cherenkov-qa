      - Operating Model: 1.4/architecture/platform-operating-model.md
      - User Journeys: 1.4/architecture/user-journeys.md
      - Clean Architecture: 1.4/architecture/clean-architecture.md
      - Module Reference: 1.4/architecture/module-reference.md
