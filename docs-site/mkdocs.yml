      - Human-in-the-Loop (HITL): guides/hitl.md
      - Certificates & Compliance: guides/certificates.md
      - Continuous Monitoring: guides/continuous-monitoring.md
      - OpenAPI Spec Integration: guides/openapi-spec.md
      - Eject to Vanilla Playwright: guides/eject.md
