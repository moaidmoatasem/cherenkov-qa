# CHERENKOV-QA — MkDocs Public Documentation Site
# Framework: Material for MkDocs
# Versioning: mike
# Deployed to: GitHub Pages (gh-pages branch)

site_name: CHERENKOV-QA
site_description: AI-native API conformance testing — OpenAPI spec to Playwright tests, locally, privately, with zero vendor lock-in.
site_url: https://moaidmoatasem.github.io/cherenkov-qa/
repo_url: https://github.com/moaidmoatasem/cherenkov-qa
repo_name: cherenkov-qa
edit_uri: edit/main/docs-site/docs/

docs_dir: docs
site_dir: site

# ── Theme ────────────────────────────────────────────────────────────────────
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - announce.dismiss
    - toc.follow
  logo: assets/logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      tip: octicons/squirrel-16
      warning: octicons/alert-16
      danger: octicons/zap-16

# ── Extra ─────────────────────────────────────────────────────────────────────
extra:
  version:
    provider: mike
    default: latest
    current: "1.4"
    versions:
      - "1.0"
      - "1.1"
      - "1.2"
      - "1.3"
      - "1.4"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/moaidmoatasem/cherenkov-qa
      name: GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/cherenkov
      name: Discord
    - icon: fontawesome/brands/twitter
      link: https://x.com/cherenkovqa
      name: Twitter / X
  generator: false  # Remove "Made with Material" footer link

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/version-banner.js

# ── Plugins ───────────────────────────────────────────────────────────────────
plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true

# ── Markdown Extensions ───────────────────────────────────────────────────────
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
      title: On this page

